name: Build and publish Unraid image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build image for Unraid
        run: docker build --pull -t wakemeops-mirror:test .
      - name: Test signed mirror and recovery after a failed sync
        run: bash tests/smoke.sh wakemeops-mirror:test
      - name: Publish tested image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag wakemeops-mirror:test "$image:$GITHUB_SHA"
          docker tag wakemeops-mirror:test "$image:latest"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
